<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planificador de Cuarto Interactivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .header {
            padding: 8px 15px;
            background: #16213e;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 { font-size: 16px; color: #00d4ff; }
        .header p { font-size: 10px; color: #aaa; margin-top: 2px; }

        .app-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 50px);
        }
        .toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 10px;
            background: #16213e;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        .toolbar button {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-add { background: #4ecdc4; color: #000; }
        .btn-delete { background: #ff6b6b; color: #fff; }
        .btn-rotate { background: #ffc107; color: #000; }
        .btn-lock { background: #ff9800; color: #000; }
        .btn-export { background: #8bc34a; color: #000; }
        .btn-reset { background: #966fd6; color: #fff; }
        .btn-list { background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff; }
        .toolbar button:active { transform: scale(0.95); }

        .info-bar {
            padding: 3px 10px;
            background: #0f3460;
            font-size: 10px;
            color: #aaa;
            text-align: center;
        }
        .info-bar span { color: #00d4ff; font-weight: bold; }

        .canvas-area {
            flex: 1;
            overflow: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            -webkit-overflow-scrolling: touch;
        }
        .wall-label {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #9fb3c8;
            white-space: nowrap;
            pointer-events: none;
        }
        .wall-top { left: 0; right: 0; top: -22px; height: 16px; border-top: 1px solid #9fb3c8; }
        .wall-bottom { left: 0; right: 0; bottom: -22px; height: 16px; border-bottom: 1px solid #9fb3c8; }
        .wall-left { left: -22px; width: 16px; writing-mode: vertical-rl; border-left: 1px solid #9fb3c8; }
        .wall-right { right: -22px; width: 16px; writing-mode: vertical-rl; border-right: 1px solid #9fb3c8; }
        .room-canvas {
            position: relative;
            background: #2a2a4a;
            border: 3px solid #fff;
            touch-action: none;
        }
        .division-line {
            position: absolute;
            background: #ff4444;
            z-index: 5;
            pointer-events: none;
        }
        .div-label {
            position: absolute;
            z-index: 6;
            color: #ff4444;
            font-size: 8px;
            font-weight: bold;
            background: #2a2a4a;
            padding: 0 3px;
            pointer-events: none;
        }
        .balcon-indicator {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 15px;
            background: rgba(139,195,74,0.1);
            border-bottom: 2px dashed #8bc34a55;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            color: #8bc34a;
        }
        .door-indicator {
            position: absolute;
            border: 2px solid #8bc34a;
            background: rgba(139,195,74,0.15);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            color: #8bc34a;
            font-weight: bold;
            border-radius: 0 0 5px 5px;
        }

        .furniture-item {
            position: absolute;
            border: 2px solid;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 8px;
            font-weight: bold;
            line-height: 1.1;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: box-shadow 0.15s;
        }
        .furniture-item:active { cursor: grabbing; }
        .furniture-item.selected {
            box-shadow: 0 0 0 3px #00d4ff, 0 0 12px rgba(0,212,255,0.5);
            z-index: 100;
        }
        .furniture-item.locked {
            opacity: 0.85;
            cursor: not-allowed;
        }
        .furniture-item .f-label {
            pointer-events: none;
            font-size: 7px;
            overflow: hidden;
        }
        .furniture-item .f-dim {
            display: block;
            font-weight: normal;
            font-size: 7px;
            opacity: 0.9;
        }
        .btn-edit { background: #00d4ff; color: #000; }
        .btn-cotas { background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff; }
        .cota {
            position: absolute;
            display: flex;
            align-items: center;
            pointer-events: none;
            font-size: 7px;
            font-weight: bold;
            line-height: 1;
        }
        .cota .ln { flex: 1; background: currentColor; opacity: 0.55; }
        .cota-h {
            right: 2px; top: 2px; height: 9px;
            flex-direction: row; gap: 2px; padding: 0 1px;
            border-left: 1px solid currentColor; border-right: 1px solid currentColor;
        }
        .cota-h .ln { height: 1px; }
        .cota-v {
            left: 2px; bottom: 2px; width: 9px;
            flex-direction: column; gap: 2px; padding: 1px 0;
            border-top: 1px solid currentColor; border-bottom: 1px solid currentColor;
        }
        .cota-v .ln { width: 1px; }
        .cota-v span { writing-mode: vertical-rl; }
        .modal .hint { font-size: 10px; color: #888; margin-top: 8px; line-height: 1.4; }
        .modal .row2 { display: flex; gap: 8px; }
        .modal .row2 > div { flex: 1; }
        .pi-edit { background: #00d4ff; color: #000; margin-right: 4px; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            border: 2px solid #0f3460;
        }
        .modal h2 { color: #00d4ff; font-size: 15px; margin-bottom: 12px; }
        .modal label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; margin-top: 8px; }
        .modal input, .modal select {
            width: 100%;
            padding: 7px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eee;
            font-size: 13px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-confirm { background: #4ecdc4; color: #000; }
        .btn-cancel { background: #444; color: #eee; }

        /* Panel */
        .panel {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 260px;
            max-width: 80vw;
            background: #16213e;
            border-left: 2px solid #0f3460;
            z-index: 500;
            overflow-y: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .panel.active { display: block; }
        .panel h3 { color: #00d4ff; margin-bottom: 8px; font-size: 13px; }
        .panel-close {
            position: absolute; top: 8px; right: 8px;
            background: #ff6b6b; border: none; color: #fff;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 12px; cursor: pointer;
        }
        .panel-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px; margin-bottom: 5px;
            background: #1a1a2e; border-radius: 4px; font-size: 10px;
        }
        .panel-item .pi-color { width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; flex-shrink: 0; }
        .panel-item .pi-info { flex: 1; }
        .panel-item .pi-name { font-weight: bold; }
        .panel-item .pi-size { color: #888; font-size: 9px; }
        .panel-item button { padding: 2px 6px; border: none; border-radius: 3px; font-size: 9px; cursor: pointer; font-weight: bold; }
        .pi-del { background: #ff6b6b; color: #fff; }

        @media (max-width: 420px) {
            .toolbar { padding: 5px 6px; gap: 4px; }
            .toolbar button { padding: 5px 7px; font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Planificador de Cuarto</h1>
    <p>Arrastra muebles | Toca para seleccionar | + Agregar / Eliminar</p>
</div>

<div class="app-container">
    <div class="toolbar">
        <button class="btn-add" onclick="openAddModal()">+ Agregar</button>
        <button class="btn-rotate" onclick="rotateSelected()">Rotar</button>
        <button class="btn-lock" onclick="toggleLockSelected()">Fijar/Soltar</button>
        <button class="btn-edit" onclick="openEditModal()">Medidas</button>
        <button class="btn-cotas" onclick="toggleCotas()">Cotas</button>
        <button class="btn-delete" onclick="deleteSelected()">Eliminar</button>
        <button class="btn-list" onclick="togglePanel()">Lista</button>
        <button class="btn-reset" onclick="resetLayout()">Reset</button>
        <button class="btn-export" onclick="exportLayout()">Exportar</button>
    </div>
    <div class="info-bar">
        Seleccionado: <span id="selectedInfo">ninguno</span>
    </div>
    <div class="canvas-area" id="canvasArea">
        <div class="room-canvas" id="roomCanvas">
            <div class="balcon-indicator">BALCON</div>
            <div class="division-line" id="divLine"></div>
            <div class="div-label" id="divLabel">DIVISION</div>
            <!-- Medidas de las paredes -->
            <div class="wall-label wall-top" id="wallTop"></div>
            <div class="wall-label wall-bottom" id="wallBottom"></div>
            <div class="wall-label wall-left" id="wallLeftA"></div>
            <div class="wall-label wall-left" id="wallLeftB"></div>
            <div class="wall-label wall-right" id="wallRightA"></div>
            <div class="wall-label wall-right" id="wallRightB"></div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2>Agregar Mueble</h2>
        <label>Nombre</label>
        <input type="text" id="mName" placeholder="Ej: Librero nuevo">
        <label>Largo (cm)</label>
        <input type="number" id="mLargo" placeholder="Ej: 120">
        <label>Ancho/Profundidad (cm)</label>
        <input type="number" id="mAncho" placeholder="Ej: 40">
        <label>Categoria</label>
        <select id="mCategory">
            <option value="storage">Almacenaje</option>
            <option value="sleep">Dormir</option>
            <option value="work">Trabajo</option>
            <option value="decor">Decoracion</option>
            <option value="entry">Entrada</option>
            <option value="fixed">Fijo</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeAddModal()">Cancelar</button>
            <button class="btn-confirm" onclick="addFurniture()">Agregar</button>
        </div>
    </div>
</div>

<!-- Modal editar medidas -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>Editar mueble</h2>
        <label>Nombre</label>
        <input type="text" id="eName" maxlength="40">
        <div class="row2">
            <div>
                <label>Largo (cm)</label>
                <input type="number" id="eLargo" min="1" max="584">
            </div>
            <div>
                <label>Ancho (cm)</label>
                <input type="number" id="eAncho" min="1" max="584">
            </div>
        </div>
        <div class="row2">
            <div>
                <label>Posicion X (cm)</label>
                <input type="number" id="eX">
            </div>
            <div>
                <label>Posicion Y (cm)</label>
                <input type="number" id="eY">
            </div>
        </div>
        <div class="hint" id="eHint"></div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
            <button class="btn-confirm" onclick="saveEdit()">Guardar</button>
        </div>
    </div>
</div>

<!-- Panel -->
<div class="panel" id="listPanel">
    <button class="panel-close" onclick="togglePanel()">X</button>
    <h3>Muebles en el cuarto</h3>
    <div id="panelList"></div>
</div>

<script>
// Room dimensions (cm) - Cuarto vertical (mas largo que ancho)
// Ancho = 224cm (pared corta, horizontal)
// Largo total = mitad1 (284) + mitad2 (300) = 584cm (vertical)
const ROOM_ANCHO = 224; // horizontal
const ROOM_LARGO = 584; // vertical (top to bottom)
const DIVISION_Y = 300; // division a 300cm desde arriba: mitad 2 (puerta) = 300cm, mitad 1 (cama) = 284cm
const ANCHO_MITAD_2 = 220; // ancho de la mitad con la puerta (arriba)
const DIVISION_LARGO = 75; // cuanto sale la division desde la pared derecha
const DIVISION_GROSOR = 10;

let SCALE = 1;
let canvasW, canvasH;

const COLORS = {
    storage: { bg: 'rgba(78,205,196,0.35)', border: '#4ecdc4', text: '#4ecdc4' },
    sleep: { bg: 'rgba(150,111,214,0.35)', border: '#966fd6', text: '#966fd6' },
    work: { bg: 'rgba(255,193,7,0.35)', border: '#ffc107', text: '#ffc107' },
    decor: { bg: 'rgba(255,152,0,0.35)', border: '#ff9800', text: '#ff9800' },
    entry: { bg: 'rgba(139,195,74,0.35)', border: '#8bc34a', text: '#8bc34a' },
    fixed: { bg: 'rgba(255,107,107,0.35)', border: '#ff6b6b', text: '#ff6b6b' },
    door: { bg: 'rgba(139,195,74,0.12)', border: '#8bc34a', text: '#8bc34a' }
};

// Puerta: cuadro de 75x75 cm sobre la pared derecha. Abarca el ancho de la puerta y su abertura.
const DEFAULT_DOOR = { id: 1, name: 'Puerta (abertura)', largo: 75, ancho: 75, x: 149, y: 0, rotated: false, locked: true, category: 'door' };

// Default furniture layout matching the correct screenshot
// x = horizontal (0=left wall, 224=right wall)
// y = vertical (0=top/entrance, 584=bottom/bed wall)
const DEFAULT_FURNITURE = [
    DEFAULT_DOOR, // primero, para que los muebles se dibujen encima
    // Posiciones y tamanos reales (cm). rotated=false -> ocupa largo (horizontal) x ancho (vertical).
    // rotated=true -> ocupa ancho (horizontal) x largo (vertical).
    { id: 2, name: 'Perchero pie', largo: 30, ancho: 30, x: 120, y: 78, rotated: false, locked: false, category: 'entry' },
    { id: 3, name: 'Mesa de adorno', largo: 80, ancho: 40, x: 45, y: 32, rotated: false, locked: false, category: 'decor' },
    { id: 4, name: 'Estante grande', largo: 90, ancho: 45, x: 0, y: 42, rotated: true, locked: false, category: 'storage' },
    { id: 5, name: 'Comoda grande', largo: 130, ancho: 43, x: 0, y: 135, rotated: true, locked: false, category: 'storage' },
    { id: 6, name: 'Escritorio', largo: 120, ancho: 60, x: 0, y: 268, rotated: true, locked: false, category: 'work' },
    { id: 7, name: 'Gavetero verde', largo: 41, ancho: 36, x: 0, y: 543, rotated: true, locked: false, category: 'storage' },
    { id: 8, name: 'Cama', largo: 195, ancho: 145, x: 39, y: 389, rotated: true, locked: false, category: 'sleep' },
    { id: 9, name: 'Mesa de noche', largo: 38, ancho: 28, x: 186, y: 546, rotated: true, locked: false, category: 'decor' },
    { id: 10, name: 'TV', largo: 50, ancho: 6, x: 170, y: 302, rotated: false, locked: true, category: 'fixed' },
    { id: 11, name: 'Estante blanco', largo: 61, ancho: 30, x: 178, y: 310, rotated: true, locked: false, category: 'storage' },
    { id: 13, name: 'Perchero de pared', largo: 180, ancho: 50, x: 174, y: 100, rotated: true, locked: false, category: 'entry' },
    { id: 14, name: 'Comoda pequena', largo: 63, ancho: 40, x: 184, y: 25, rotated: true, locked: false, category: 'storage' },
];

let furnitureList = JSON.parse(JSON.stringify(DEFAULT_FURNITURE));
let nextId = 20;
let selectedId = null;

function calculateScale() {
    const area = document.getElementById('canvasArea');
    const availW = area.clientWidth - 60;
    const availH = area.clientHeight - 60;
    const scaleW = availW / ROOM_ANCHO;
    const scaleH = availH / ROOM_LARGO;
    SCALE = Math.min(scaleW, scaleH, 2.0);
    SCALE = Math.max(SCALE, 0.4);
    canvasW = ROOM_ANCHO * SCALE;
    canvasH = ROOM_LARGO * SCALE;
}

function renderRoom() {
    calculateScale();
    const canvas = document.getElementById('roomCanvas');
    canvas.style.width = canvasW + 'px';
    canvas.style.height = canvasH + 'px';

    // Division: pedazo de pared que sale de la pared derecha (75cm de largo x 10cm de grosor).
    // Su cara inferior esta a DIVISION_Y (300cm desde arriba).
    const divLine = document.getElementById('divLine');
    const divY = DIVISION_Y * SCALE;
    divLine.style.left = ((ROOM_ANCHO - DIVISION_LARGO) * SCALE) + 'px';
    divLine.style.top = ((DIVISION_Y - DIVISION_GROSOR) * SCALE) + 'px';
    divLine.style.width = (DIVISION_LARGO * SCALE) + 'px';
    divLine.style.height = (DIVISION_GROSOR * SCALE) + 'px';

    const divLabel = document.getElementById('divLabel');
    divLabel.style.top = ((DIVISION_Y - DIVISION_GROSOR) * SCALE - 11) + 'px';
    divLabel.style.left = ((ROOM_ANCHO - DIVISION_LARGO / 2) * SCALE) + 'px';
    divLabel.style.transform = 'translateX(-50%)';

    // Medidas en cada pared
    const topLen = DIVISION_Y * SCALE;
    const botLen = (ROOM_LARGO - DIVISION_Y) * SCALE;
    const setWall = (id, text, top, height) => {
        const el = document.getElementById(id);
        el.textContent = text;
        if (top !== undefined) { el.style.top = top + 'px'; el.style.height = height + 'px'; }
    };
    setWall('wallTop', ANCHO_MITAD_2 + ' cm');
    setWall('wallBottom', ROOM_ANCHO + ' cm');
    setWall('wallLeftA', DIVISION_Y + ' cm', 2, topLen - 4);
    setWall('wallLeftB', (ROOM_LARGO - DIVISION_Y) + ' cm', topLen + 2, botLen - 4);
    setWall('wallRightA', DIVISION_Y + ' cm', 2, topLen - 4);
    setWall('wallRightB', (ROOM_LARGO - DIVISION_Y) + ' cm', topLen + 2, botLen - 4);

    // Balcon: franja de 28cm arriba
    document.querySelector('.balcon-indicator').style.height = (28 * SCALE) + 'px';


    // Remove old furniture
    canvas.querySelectorAll('.furniture-item').forEach(el => el.remove());

    // Render furniture
    furnitureList.forEach(f => {
        const el = document.createElement('div');
        el.className = 'furniture-item' + (f.locked ? ' locked' : '') + (f.id === selectedId ? ' selected' : '');
        const col = COLORS[f.category] || COLORS.storage;
        el.style.background = col.bg;
        el.style.borderColor = col.border;
        el.style.color = col.text;
        if (f.category === 'door') el.style.borderStyle = 'dashed';

        // rotated swaps width/height visually
        const w = (f.rotated ? f.ancho : f.largo) * SCALE;
        const h = (f.rotated ? f.largo : f.ancho) * SCALE;
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.left = (f.x * SCALE) + 'px';
        el.style.top = (f.y * SCALE) + 'px';

        el.dataset.id = f.id;
        const dimText = Math.round(f.rotated ? f.ancho : f.largo) + '\u00d7' + Math.round(f.rotated ? f.largo : f.ancho);
        el.title = f.name + ' ' + dimText + ' cm';
        // Cotas: lineas de medida en los bordes del mueble (como las de las paredes del cuarto).
        // Siempre muestran el ancho y el alto tal como se ve dibujado (ya rotado).
        const wCm = f.rotated ? f.ancho : f.largo;
        const hCm = f.rotated ? f.largo : f.ancho;
        const showH = showCotas && w >= 34 && h >= 14;
        const showV = showCotas && h >= 34 && w >= 14;
        const hasName = h >= 22 && w >= 30;
        let html = '';
        if (showH || showV) {
            // Con cotas basta el nombre; la medida ya esta en las lineas
            if (hasName) html += '<span class="f-label">' + esc(f.name) + '</span>';
            if (showH) html += '<div class="cota cota-h" style="left:' + (showV ? 12 : 2) + 'px"><i class="ln"></i><span>' + fmt(wCm) + '</span><i class="ln"></i></div>';
            if (showV) html += '<div class="cota cota-v" style="top:' + (showH ? 12 : 2) + 'px"><i class="ln"></i><span>' + fmt(hCm) + '</span><i class="ln"></i></div>';
        } else if (hasName) {
            // Sin cotas (apagadas o no caben): nombre + medida
            html = '<span class="f-label">' + esc(f.name) + '<span class="f-dim">' + dimText + '</span></span>';
        } else if (h >= 9 && w >= 22) {
            html = '<span class="f-label">' + dimText + '</span>';
        }
        el.innerHTML = html;
        // El nombre se centra en el espacio que dejan las lineas de medida
        if (showV) el.style.paddingLeft = '12px';
        if (showH) el.style.paddingTop = '12px';

        el.addEventListener('mousedown', (e) => startDrag(e, f));
        el.addEventListener('touchstart', (e) => startDrag(e, f), { passive: false });
        el.addEventListener('click', () => {
            // Doble toque / doble click abre el editor de medidas
            const now = Date.now();
            const isDouble = lastTap.id === f.id && now - lastTap.time < 400;
            lastTap = { id: f.id, time: now };
            selectFurniture(f.id);
            if (isDouble) { lastTap = { id: null, time: 0 }; openEditModal(); }
        });

        canvas.appendChild(el);
    });

    updatePanel();
}

let lastTap = { id: null, time: 0 };
let showCotas = localStorage.getItem('roomPlannerCotas') !== '0';

function fmt(n) { return String(Math.round(n * 10) / 10); }

function toggleCotas() {
    showCotas = !showCotas;
    localStorage.setItem('roomPlannerCotas', showCotas ? '1' : '0');
    renderRoom();
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function selectFurniture(id) {
    selectedId = id;
    const f = furnitureList.find(x => x.id === id);
    document.getElementById('selectedInfo').textContent = f ? f.name + ' (' + f.largo + 'x' + f.ancho + 'cm)' : 'ninguno';
    renderRoom();
}

// Drag
let dragging = null;
let dragOffset = { x: 0, y: 0 };

function startDrag(e, f) {
    if (f.locked) { selectFurniture(f.id); return; }
    e.preventDefault();
    selectFurniture(f.id);
    dragging = f;
    const rect = document.getElementById('roomCanvas').getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    dragOffset.x = cx - rect.left - (f.x * SCALE);
    dragOffset.y = cy - rect.top - (f.y * SCALE);
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchmove', onDrag, { passive: false });
    document.addEventListener('touchend', endDrag);
}

function onDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    const rect = document.getElementById('roomCanvas').getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    let nx = (cx - rect.left - dragOffset.x) / SCALE;
    let ny = (cy - rect.top - dragOffset.y) / SCALE;
    const fw = dragging.rotated ? dragging.ancho : dragging.largo;
    const fh = dragging.rotated ? dragging.largo : dragging.ancho;
    nx = Math.max(0, Math.min(nx, ROOM_ANCHO - fw));
    ny = Math.max(0, Math.min(ny, ROOM_LARGO - fh));
    dragging.x = Math.round(nx);
    dragging.y = Math.round(ny);
    const el = document.querySelector('[data-id="' + dragging.id + '"]');
    if (el) {
        el.style.left = (dragging.x * SCALE) + 'px';
        el.style.top = (dragging.y * SCALE) + 'px';
    }
}

function endDrag() {
    dragging = null;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('touchend', endDrag);
    saveToLocal();
}

function rotateSelected() {
    const f = furnitureList.find(x => x.id === selectedId);
    if (!f || f.locked) return;
    const oldW = f.rotated ? f.ancho : f.largo;
    const oldH = f.rotated ? f.largo : f.ancho;
    const newW = oldH;
    const newH = oldW;
    if (newW > ROOM_ANCHO || newH > ROOM_LARGO) {
        alert('Rotado no cabe en el cuarto (' + fmt(newW) + '\u00d7' + fmt(newH) + ' cm).');
        return;
    }
    // Gira alrededor del centro del mueble (no de la esquina) y lo mantiene dentro del cuarto.
    // Las medidas no cambian: solo se intercambian el ancho y el alto dibujados.
    const cx = f.x + oldW / 2;
    const cy = f.y + oldH / 2;
    f.rotated = !f.rotated;
    f.x = Math.round(Math.max(0, Math.min(cx - newW / 2, ROOM_ANCHO - newW)));
    f.y = Math.round(Math.max(0, Math.min(cy - newH / 2, ROOM_LARGO - newH)));
    renderRoom();
    saveToLocal();
}

function toggleLockSelected() {
    const f = furnitureList.find(x => x.id === selectedId);
    if (!f) { alert('Selecciona un mueble primero'); return; }
    f.locked = !f.locked;
    renderRoom();
    saveToLocal();
}

function deleteSelected() {
    if (!selectedId) return;
    const f = furnitureList.find(x => x.id === selectedId);
    if (f && f.locked) { alert('Este mueble esta fijo. Usa "Fijar/Soltar" para soltarlo y luego eliminalo.'); return; }
    if (f && confirm('Eliminar "' + f.name + '"?')) {
        furnitureList = furnitureList.filter(x => x.id !== selectedId);
        selectedId = null;
        document.getElementById('selectedInfo').textContent = 'ninguno';
        renderRoom();
        saveToLocal();
    }
}

function openAddModal() { document.getElementById('addModal').classList.add('active'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

function addFurniture() {
    const name = document.getElementById('mName').value.trim();
    const largo = parseInt(document.getElementById('mLargo').value);
    const ancho = parseInt(document.getElementById('mAncho').value);
    const cat = document.getElementById('mCategory').value;
    if (!name || !largo || !ancho) { alert('Completa todos los campos'); return; }
    furnitureList.push({
        id: nextId++, name, largo, ancho,
        x: 80, y: 290,
        rotated: false, locked: cat === 'fixed', category: cat
    });
    document.getElementById('mName').value = '';
    document.getElementById('mLargo').value = '';
    document.getElementById('mAncho').value = '';
    closeAddModal();
    renderRoom();
    saveToLocal();
}

// Editar nombre, medidas y posicion de un mueble
let editingId = null;

function openEditModal(id) {
    const fid = id !== undefined ? id : selectedId;
    const f = furnitureList.find(x => x.id === fid);
    if (!f) { alert('Selecciona un mueble primero'); return; }
    editingId = f.id;
    document.getElementById('eName').value = f.name;
    document.getElementById('eLargo').value = f.largo;
    document.getElementById('eAncho').value = f.ancho;
    document.getElementById('eX').value = f.x;
    document.getElementById('eY').value = f.y;
    document.getElementById('eHint').textContent =
        'Largo y ancho son las medidas del mueble. Se dibuja ' +
        (f.rotated ? f.ancho + '\u00d7' + f.largo : f.largo + '\u00d7' + f.ancho) +
        ' cm (horizontal \u00d7 vertical); usa "Rotar" para girarlo. ' +
        'Cuarto: ' + ROOM_ANCHO + '\u00d7' + ROOM_LARGO + ' cm.';
    document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
    editingId = null;
    document.getElementById('editModal').classList.remove('active');
}

function saveEdit() {
    const f = furnitureList.find(x => x.id === editingId);
    if (!f) { closeEditModal(); return; }
    const name = document.getElementById('eName').value.trim();
    const largo = parseFloat(document.getElementById('eLargo').value);
    const ancho = parseFloat(document.getElementById('eAncho').value);
    const x = parseFloat(document.getElementById('eX').value);
    const y = parseFloat(document.getElementById('eY').value);
    if (!name || !(largo >= 1) || !(ancho >= 1)) { alert('Escribe un nombre y medidas mayores a 0'); return; }
    if (largo > ROOM_LARGO || ancho > ROOM_LARGO) { alert('Las medidas no pueden ser mayores que el cuarto'); return; }
    const w = f.rotated ? ancho : largo;
    const h = f.rotated ? largo : ancho;
    if (w > ROOM_ANCHO) { alert('Con esa medida el mueble no cabe en el ancho del cuarto (' + ROOM_ANCHO + ' cm). Prueba rotarlo.'); return; }
    f.name = name;
    f.largo = Math.round(largo * 10) / 10;
    f.ancho = Math.round(ancho * 10) / 10;
    // Mantener el mueble dentro del cuarto
    const nx = isNaN(x) ? f.x : x;
    const ny = isNaN(y) ? f.y : y;
    f.x = Math.round(Math.max(0, Math.min(nx, ROOM_ANCHO - w)));
    f.y = Math.round(Math.max(0, Math.min(ny, ROOM_LARGO - h)));
    closeEditModal();
    selectFurniture(f.id);
    saveToLocal();
}

function togglePanel() {
    document.getElementById('listPanel').classList.toggle('active');
    updatePanel();
}

function updatePanel() {
    const list = document.getElementById('panelList');
    list.innerHTML = '';
    furnitureList.forEach(f => {
        const col = COLORS[f.category] || COLORS.storage;
        list.innerHTML += '<div class="panel-item">' +
            '<div class="pi-color" style="background:' + col.border + '"></div>' +
            '<div class="pi-info"><div class="pi-name">' + esc(f.name) + (f.locked ? ' (fijo)' : '') + '</div>' +
            '<div class="pi-size">' + f.largo + 'x' + f.ancho + 'cm</div></div>' +
            '<button class="pi-edit" onclick="openEditModal(' + f.id + ')">Medidas</button>' +
            (f.locked ? '' : '<button class="pi-del" onclick="deleteFurnitureById(' + f.id + ')">X</button>') +
            '</div>';
    });
}

function deleteFurnitureById(id) {
    const f = furnitureList.find(x => x.id === id);
    if (f && confirm('Eliminar "' + f.name + '"?')) {
        furnitureList = furnitureList.filter(x => x.id !== id);
        if (selectedId === id) selectedId = null;
        renderRoom();
        saveToLocal();
    }
}

function resetLayout() {
    if (confirm('Resetear a la posicion original?')) {
        localStorage.removeItem('roomPlanner');
        localStorage.removeItem('roomPlannerNextId');
        furnitureList = JSON.parse(JSON.stringify(DEFAULT_FURNITURE));
        nextId = 20;
        selectedId = null;
        document.getElementById('selectedInfo').textContent = 'ninguno';
        renderRoom();
    }
}

function exportLayout() {
    let t = 'DISTRIBUCION DEL CUARTO\n========================\n\n';
    furnitureList.forEach(f => {
        t += f.name + ' (' + f.largo + 'x' + f.ancho + 'cm)';
        t += f.locked ? ' [FIJO]' : '';
        t += ' - Pos: (' + f.x + ',' + f.y + ')cm';
        t += f.rotated ? ' [Rotado]' : '';
        t += '\n';
    });
    const blob = new Blob([t], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'distribucion-cuarto.txt';
    a.click();
}

function saveToLocal() {
    localStorage.setItem('roomPlanner', JSON.stringify(furnitureList));
    localStorage.setItem('roomPlannerNextId', nextId);
}

function loadFromLocal() {
    const saved = localStorage.getItem('roomPlanner');
    if (saved) {
        furnitureList = JSON.parse(saved);
        nextId = parseInt(localStorage.getItem('roomPlannerNextId') || '20');
        // Migracion unica: la puerta ahora es un cuadro de 75x75 que forma parte de la lista.
        if (!localStorage.getItem('roomPlannerPuerta75')) {
            if (!furnitureList.some(f => f.id === 1)) furnitureList.unshift(JSON.parse(JSON.stringify(DEFAULT_DOOR)));
            localStorage.setItem('roomPlannerPuerta75', '1');
            saveToLocal();
        }
        // Migracion unica: el perchero de pared ya no es fijo (solo la TV).
        // Los datos guardados antes de este cambio lo traen bloqueado.
        if (!localStorage.getItem('roomPlannerPercheroLibre')) {
            furnitureList.forEach(f => {
                if (f.id === 13) {
                    f.locked = false;
                    f.name = 'Perchero de pared';
                    if (f.category === 'fixed') f.category = 'entry';
                }
            });
            localStorage.setItem('roomPlannerPercheroLibre', '1');
            saveToLocal();
        }
    }
}

window.addEventListener('load', () => { loadFromLocal(); renderRoom(); });
window.addEventListener('resize', renderRoom);
</script>
