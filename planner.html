<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planificador de Cuarto Interactivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .header {
            padding: 10px 15px;
            background: #16213e;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 { font-size: 18px; color: #00d4ff; }
        .header p { font-size: 11px; color: #aaa; margin-top: 3px; }

        .app-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }
        .toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #16213e;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        .toolbar button {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-add { background: #4ecdc4; color: #000; }
        .btn-delete { background: #ff6b6b; color: #fff; }
        .btn-rotate { background: #ffc107; color: #000; }
        .btn-lock { background: #966fd6; color: #fff; }
        .btn-export { background: #8bc34a; color: #000; }
        .toolbar button:active { transform: scale(0.95); }

        .canvas-area {
            flex: 1;
            overflow: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .room-canvas {
            position: relative;
            background: #2a2a4a;
            border: 3px solid #fff;
            touch-action: none;
        }
        .division-line {
            position: absolute;
            background: #ff4444;
            z-index: 5;
            pointer-events: none;
        }
        .div-label {
            position: absolute;
            z-index: 6;
            color: #ff4444;
            font-size: 9px;
            font-weight: bold;
            background: #2a2a4a;
            padding: 0 4px;
            pointer-events: none;
        }

        .furniture-item {
            position: absolute;
            border: 2px solid;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 9px;
            font-weight: bold;
            line-height: 1.1;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: box-shadow 0.15s;
        }
        .furniture-item:active { cursor: grabbing; }
        .furniture-item.selected {
            box-shadow: 0 0 0 3px #00d4ff, 0 0 15px rgba(0,212,255,0.5);
            z-index: 100;
        }
        .furniture-item.locked {
            opacity: 0.8;
            cursor: not-allowed;
            border-style: solid;
        }
        .furniture-item .f-label {
            pointer-events: none;
            font-size: 8px;
            overflow: hidden;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            border: 2px solid #0f3460;
        }
        .modal h2 { color: #00d4ff; font-size: 16px; margin-bottom: 15px; }
        .modal label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 10px; }
        .modal input, .modal select {
            width: 100%;
            padding: 8px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eee;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-confirm { background: #4ecdc4; color: #000; }
        .btn-cancel { background: #444; color: #eee; }

        /* Furniture list panel */
        .panel {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 280px;
            max-width: 85vw;
            background: #16213e;
            border-left: 2px solid #0f3460;
            z-index: 500;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .panel.active { display: block; }
        .panel h3 { color: #00d4ff; margin-bottom: 10px; font-size: 14px; }
        .panel-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
        }
        .panel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            margin-bottom: 6px;
            background: #1a1a2e;
            border-radius: 5px;
            font-size: 11px;
        }
        .panel-item .pi-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .panel-item .pi-info { flex: 1; }
        .panel-item .pi-name { font-weight: bold; }
        .panel-item .pi-size { color: #888; font-size: 10px; }
        .panel-item button {
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .pi-del { background: #ff6b6b; color: #fff; }

        .btn-list { background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff; }

        .info-bar {
            padding: 4px 12px;
            background: #0f3460;
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }
        .info-bar span { color: #00d4ff; font-weight: bold; }

        @media (max-width: 500px) {
            .toolbar { padding: 6px 8px; gap: 5px; }
            .toolbar button { padding: 5px 8px; font-size: 11px; }
            .header h1 { font-size: 15px; }
        }
</style>
</head>
<body>
<div class="header">
    <h1>Planificador de Cuarto</h1>
    <p>Arrastra los muebles | Toca para seleccionar | Agrega o elimina muebles</p>
</div>

<div class="app-container">
    <div class="toolbar">
        <button class="btn-add" onclick="openAddModal()">+ Agregar</button>
        <button class="btn-rotate" onclick="rotateSelected()">Rotar</button>
        <button class="btn-delete" onclick="deleteSelected()">Eliminar</button>
        <button class="btn-list" onclick="togglePanel()">Lista</button>
        <button class="btn-export" onclick="exportLayout()">Exportar</button>
    </div>
    <div class="info-bar">
        Seleccionado: <span id="selectedInfo">ninguno</span>
    </div>
    <div class="canvas-area" id="canvasArea">
        <div class="room-canvas" id="roomCanvas">
            <div class="division-line" id="divLine"></div>
            <div class="div-label" id="divLabel">DIVISION</div>
        </div>
    </div>
</div>

<!-- Add furniture modal -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2>Agregar Mueble</h2>
        <label>Nombre</label>
        <input type="text" id="mName" placeholder="Ej: Librero nuevo">
        <label>Largo (cm)</label>
        <input type="number" id="mLargo" placeholder="Ej: 120">
        <label>Ancho/Profundidad (cm)</label>
        <input type="number" id="mAncho" placeholder="Ej: 40">
        <label>Categoria</label>
        <select id="mCategory">
            <option value="storage">Almacenaje</option>
            <option value="sleep">Dormir</option>
            <option value="work">Trabajo</option>
            <option value="decor">Decoracion</option>
            <option value="entry">Entrada</option>
            <option value="fixed">Fijo</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeAddModal()">Cancelar</button>
            <button class="btn-confirm" onclick="addFurniture()">Agregar</button>
        </div>
    </div>
</div>

<!-- Furniture list panel -->
<div class="panel" id="listPanel">
    <button class="panel-close" onclick="togglePanel()">X</button>
    <h3>Muebles en el cuarto</h3>
    <div id="panelList"></div>
</div>

<script>
// Room config (cm)
const ROOM = {
    mitad1: { largo: 284, ancho: 224 },
    mitad2: { largo: 300, ancho: 220 }
};
// Total room: largo = mitad1.largo + mitad2.largo (vertical), ancho ~= 224 (horizontal)
const TOTAL_LARGO = ROOM.mitad1.largo + ROOM.mitad2.largo; // 584cm vertical
const TOTAL_ANCHO = Math.max(ROOM.mitad1.ancho, ROOM.mitad2.ancho); // 224cm horizontal
const DIVISION_AT = ROOM.mitad1.largo; // 284cm from top

// Scale: fit the room in available space
let SCALE = 1;
let canvasW, canvasH;

const COLORS = {
    storage: { bg: 'rgba(78,205,196,0.35)', border: '#4ecdc4', text: '#4ecdc4' },
    sleep: { bg: 'rgba(150,111,214,0.35)', border: '#966fd6', text: '#966fd6' },
    work: { bg: 'rgba(255,193,7,0.35)', border: '#ffc107', text: '#ffc107' },
    decor: { bg: 'rgba(255,152,0,0.35)', border: '#ff9800', text: '#ff9800' },
    entry: { bg: 'rgba(139,195,74,0.35)', border: '#8bc34a', text: '#8bc34a' },
    fixed: { bg: 'rgba(255,107,107,0.35)', border: '#ff6b6b', text: '#ff6b6b' }
};

// Furniture: {id, name, largo(cm), ancho(cm), x(cm), y(cm), rotated, locked, category}
let furnitureList = [
    { id: 1, name: 'Puerta', largo: 80, ancho: 10, x: 0, y: 10, rotated: true, locked: true, category: 'entry' },
    { id: 2, name: 'Perchero pie', largo: 30, ancho: 30, x: 95, y: 5, rotated: false, locked: false, category: 'entry' },
    { id: 3, name: 'Mesa adorno', largo: 80, ancho: 40, x: 130, y: 5, rotated: false, locked: false, category: 'decor' },
    { id: 4, name: 'Estante grande', largo: 90, ancho: 45, x: 179, y: 50, rotated: true, locked: false, category: 'storage' },
    { id: 5, name: 'Comoda grande', largo: 130, ancho: 43, x: 179, y: 145, rotated: true, locked: false, category: 'storage' },
    { id: 6, name: 'Escritorio', largo: 120, ancho: 60, x: 164, y: 310, rotated: true, locked: false, category: 'work' },
    { id: 7, name: 'Gavetero verde', largo: 41, ancho: 36, x: 148, y: 468, rotated: false, locked: false, category: 'storage' },
    { id: 8, name: 'Cama', largo: 195, ancho: 145, x: 20, y: 439, rotated: false, locked: false, category: 'sleep' },
    { id: 9, name: 'Mesa de noche', largo: 38, ancho: 28, x: 2, y: 446, rotated: true, locked: false, category: 'decor' },
    { id: 10, name: 'TV', largo: 60, ancho: 10, x: 2, y: 300, rotated: true, locked: true, category: 'fixed' },
    { id: 11, name: 'Estante blanco', largo: 61, ancho: 30, x: 2, y: 370, rotated: true, locked: false, category: 'storage' },
    { id: 13, name: 'Perchero fijo', largo: 180, ancho: 50, x: 2, y: 95, rotated: true, locked: true, category: 'fixed' },
];

let nextId = 20;
let selectedId = null;

function calculateScale() {
    const area = document.getElementById('canvasArea');
    const availW = area.clientWidth - 20;
    const availH = area.clientHeight - 20;
    const scaleW = availW / TOTAL_ANCHO;
    const scaleH = availH / TOTAL_LARGO;
    SCALE = Math.min(scaleW, scaleH, 2.5);
    SCALE = Math.max(SCALE, 0.5);
    canvasW = TOTAL_ANCHO * SCALE;
    canvasH = TOTAL_LARGO * SCALE;
}

function renderRoom() {
    calculateScale();
    const canvas = document.getElementById('roomCanvas');
    canvas.style.width = canvasW + 'px';
    canvas.style.height = canvasH + 'px';

    // Division line
    const divLine = document.getElementById('divLine');
    const divY = DIVISION_AT * SCALE;
    divLine.style.left = '0';
    divLine.style.top = divY + 'px';
    divLine.style.width = '100%';
    divLine.style.height = '3px';

    const divLabel = document.getElementById('divLabel');
    divLabel.style.top = (divY - 8) + 'px';
    divLabel.style.left = '50%';
    divLabel.style.transform = 'translateX(-50%)';

    // Remove old furniture elements
    canvas.querySelectorAll('.furniture-item').forEach(el => el.remove());

    // Render furniture
    furnitureList.forEach(f => {
        const el = document.createElement('div');
        el.className = 'furniture-item' + (f.locked ? ' locked' : '') + (f.id === selectedId ? ' selected' : '');
        const col = COLORS[f.category] || COLORS.storage;
        el.style.background = col.bg;
        el.style.borderColor = col.border;
        el.style.color = col.text;

        const w = (f.rotated ? f.ancho : f.largo) * SCALE;
        const h = (f.rotated ? f.largo : f.ancho) * SCALE;
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.left = (f.x * SCALE) + 'px';
        el.style.top = (f.y * SCALE) + 'px';

        el.dataset.id = f.id;
        el.innerHTML = '<span class="f-label">' + f.name + '</span>';

        // Events
        el.addEventListener('mousedown', (e) => startDrag(e, f));
        el.addEventListener('touchstart', (e) => startDrag(e, f), { passive: false });
        el.addEventListener('click', () => selectFurniture(f.id));

        canvas.appendChild(el);
    });

    updatePanel();
}

// Selection
function selectFurniture(id) {
    selectedId = id;
    const f = furnitureList.find(x => x.id === id);
    document.getElementById('selectedInfo').textContent = f ? f.name + ' (' + f.largo + 'x' + f.ancho + 'cm)' : 'ninguno';
    renderRoom();
}

// Drag & drop
let dragging = null;
let dragOffset = { x: 0, y: 0 };

function startDrag(e, f) {
    if (f.locked) return;
    e.preventDefault();
    selectFurniture(f.id);
    dragging = f;

    const rect = document.getElementById('roomCanvas').getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragOffset.x = clientX - rect.left - (f.x * SCALE);
    dragOffset.y = clientY - rect.top - (f.y * SCALE);

    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchmove', onDrag, { passive: false });
    document.addEventListener('touchend', endDrag);
}

function onDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    const rect = document.getElementById('roomCanvas').getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    let newX = (clientX - rect.left - dragOffset.x) / SCALE;
    let newY = (clientY - rect.top - dragOffset.y) / SCALE;

    // Bounds
    const fw = dragging.rotated ? dragging.ancho : dragging.largo;
    const fh = dragging.rotated ? dragging.largo : dragging.ancho;
    newX = Math.max(0, Math.min(newX, TOTAL_ANCHO - fw));
    newY = Math.max(0, Math.min(newY, TOTAL_LARGO - fh));

    dragging.x = Math.round(newX);
    dragging.y = Math.round(newY);

    // Move element directly for performance
    const el = document.querySelector('[data-id="' + dragging.id + '"]');
    if (el) {
        el.style.left = (dragging.x * SCALE) + 'px';
        el.style.top = (dragging.y * SCALE) + 'px';
    }
}

function endDrag() {
    dragging = null;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('touchend', endDrag);
    saveToLocal();
}

// Rotate
function rotateSelected() {
    const f = furnitureList.find(x => x.id === selectedId);
    if (!f || f.locked) return;
    f.rotated = !f.rotated;
    renderRoom();
    saveToLocal();
}

// Delete
function deleteSelected() {
    if (!selectedId) return;
    const f = furnitureList.find(x => x.id === selectedId);
    if (f && f.locked) { alert('Este mueble esta fijo y no se puede eliminar.'); return; }
    if (confirm('Eliminar "' + f.name + '"?')) {
        furnitureList = furnitureList.filter(x => x.id !== selectedId);
        selectedId = null;
        document.getElementById('selectedInfo').textContent = 'ninguno';
        renderRoom();
        saveToLocal();
    }
}

// Add modal
function openAddModal() { document.getElementById('addModal').classList.add('active'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

function addFurniture() {
    const name = document.getElementById('mName').value.trim();
    const largo = parseInt(document.getElementById('mLargo').value);
    const ancho = parseInt(document.getElementById('mAncho').value);
    const cat = document.getElementById('mCategory').value;

    if (!name || !largo || !ancho) { alert('Completa todos los campos'); return; }

    furnitureList.push({
        id: nextId++,
        name: name,
        largo: largo,
        ancho: ancho,
        x: 50,
        y: 300,
        rotated: false,
        locked: cat === 'fixed',
        category: cat
    });

    // Clear form
    document.getElementById('mName').value = '';
    document.getElementById('mLargo').value = '';
    document.getElementById('mAncho').value = '';
    closeAddModal();
    renderRoom();
    saveToLocal();
}

// Panel
function togglePanel() {
    document.getElementById('listPanel').classList.toggle('active');
    updatePanel();
}

function updatePanel() {
    const list = document.getElementById('panelList');
    list.innerHTML = '';
    furnitureList.forEach(f => {
        const col = COLORS[f.category] || COLORS.storage;
        list.innerHTML += '<div class="panel-item">' +
            '<div class="pi-color" style="background:' + col.border + '"></div>' +
            '<div class="pi-info"><div class="pi-name">' + f.name + (f.locked ? ' (fijo)' : '') + '</div>' +
            '<div class="pi-size">' + f.largo + 'cm x ' + f.ancho + 'cm</div></div>' +
            (f.locked ? '' : '<button class="pi-del" onclick="deleteFurnitureById(' + f.id + ')">X</button>') +
            '</div>';
    });
}

function deleteFurnitureById(id) {
    const f = furnitureList.find(x => x.id === id);
    if (f && confirm('Eliminar "' + f.name + '"?')) {
        furnitureList = furnitureList.filter(x => x.id !== id);
        if (selectedId === id) selectedId = null;
        renderRoom();
        saveToLocal();
    }
}

// Export
function exportLayout() {
    let text = 'DISTRIBUCION DEL CUARTO\n';
    text += '========================\n\n';
    furnitureList.forEach(f => {
        text += f.name + ' (' + f.largo + 'x' + f.ancho + 'cm)';
        text += f.locked ? ' [FIJO]' : '';
        text += ' - Pos: (' + f.x + ', ' + f.y + ')cm';
        text += f.rotated ? ' [Rotado]' : '';
        text += '\n';
    });
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'distribucion-cuarto.txt';
    a.click();
    URL.revokeObjectURL(url);
}

// Local storage
function saveToLocal() {
    localStorage.setItem('roomPlanner', JSON.stringify(furnitureList));
    localStorage.setItem('roomPlannerNextId', nextId);
}

function loadFromLocal() {
    const saved = localStorage.getItem('roomPlanner');
    if (saved) {
        furnitureList = JSON.parse(saved);
        nextId = parseInt(localStorage.getItem('roomPlannerNextId') || '20');
    }
}

// Init
window.addEventListener('load', () => {
    loadFromLocal();
    renderRoom();
});
window.addEventListener('resize', renderRoom);
</script>
</body>
</html>
